<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>First Light</title>
        <!-- marked turns the model's markdown into HTML; DOMPurify strips anything unsafe from it. -->
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                color: #e8e9f5;
                height: 100vh;
                display: flex;
                justify-content: center;
                padding: 2rem 1rem;
                /* A few dots of light on a dark blue sky */
                background:
                    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
                    radial-gradient(1px 1px at 30% 70%, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent),
                    radial-gradient(1px 1px at 75% 45%, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 90% 80%, #fff, transparent),
                    radial-gradient(1px 1px at 20% 90%, #fff, transparent),
                    radial-gradient(ellipse at top, #1b2050, #05060f 70%);
                background-attachment: fixed;
            }
            #container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
            }
            header h1 {
                font-family: Georgia, serif;
                font-weight: normal;
                font-size: 2rem;
            }
            header p {
                color: #8a8fb3;
                margin-top: 0.25rem;
            }
            #examples {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-top: 1rem;
            }
            #examples button {
                background: transparent;
                color: #a9b4ff;
                border: 1px solid #343a6b;
                border-radius: 999px;
                padding: 0.4rem 0.9rem;
                font-size: 0.85rem;
                cursor: pointer;
            }
            #examples button:hover {
                border-color: #a9b4ff;
            }
            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 1.5rem 0;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .msg {
                line-height: 1.6;
                max-width: 85%;
                padding: 0.75rem 1rem;
                border-radius: 12px;
            }
            .msg.user {
                align-self: flex-end;
                background: #2a3170;
            }
            .msg.assistant {
                align-self: flex-start;
                background: rgba(16, 19, 42, 0.85);
                border: 1px solid #262b55;
            }
            .msg.loading {
                color: #8a8fb3;
            }
            .msg ul,
            .msg ol {
                padding-left: 1.25rem;
            }
            .msg p + p,
            .msg p + ul,
            .msg ul + p {
                margin-top: 0.5rem;
            }
            .msg strong {
                color: #f5c97a;
            }
            .tool {
                font-size: 0.8rem;
                color: #8a8fb3;
            }
            .tool summary {
                cursor: pointer;
            }
            .tool pre {
                font-family: ui-monospace, monospace;
                white-space: pre-wrap;
                word-break: break-word;
                background: rgba(0, 0, 0, 0.4);
                padding: 0.5rem 0.75rem;
                border-radius: 8px;
                margin-top: 0.25rem;
                max-height: 250px;
                overflow-y: auto;
            }
            #input-area {
                display: flex;
                gap: 0.5rem;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 1rem;
                background: #10132a;
                color: #e8e9f5;
                border: 1px solid #343a6b;
                border-radius: 999px;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-color: #a9b4ff;
            }
            #send-btn {
                padding: 0.75rem 1.5rem;
                background: #a9b4ff;
                color: #05060f;
                border: none;
                border-radius: 999px;
                font-weight: 600;
                cursor: pointer;
            }
            #send-btn:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <h1>🔭 First Light</h1>
                <p>
                    Tell me your city and I'll tell you which planets are up tonight, which way to face, and
                    whether the sky will be clear.
                </p>
                <div id="examples">
                    <button>What can I see tonight from New York?</button>
                    <button>Which night this week is best for Saturn in Chicago?</button>
                    <button>Is the Moon up tonight in San Juan, Puerto Rico?</button>
                </div>
            </header>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Ask about tonight's sky..." autocomplete="off" />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            const TOOL_LABELS = {
                get_visible_objects: "Checked NASA for planet positions",
                get_night_forecast: "Checked the night forecast",
                get_light_pollution: "Checked the light pollution database",
            };

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className = "msg " + role + (isLoading ? " loading" : "");
                div.textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            // A collapsed line per tool call; click it to see the arguments and the result.
            function addToolCall(call, before) {
                const details = document.createElement("details");
                details.className = "tool";
                const summary = document.createElement("summary");
                summary.textContent = (TOOL_LABELS[call.name] || call.name);
                const pre = document.createElement("pre");
                pre.textContent = call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result;
                details.append(summary, pre);
                messages.insertBefore(details, before);
            }

            async function send(text) {
                text = text.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("user", text);
                const reply = addMessage("assistant", "Looking at the sky...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    for (const call of data.tool_calls || []) addToolCall(call, reply);
                    reply.innerHTML = DOMPurify.sanitize(marked.parse(data.response));
                } catch (e) {
                    reply.textContent = "Error: " + e.message;
                }
                reply.classList.remove("loading");
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", () => send(userInput.value));
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") send(userInput.value);
            });
            for (const button of document.querySelectorAll("#examples button")) {
                button.addEventListener("click", () => send(button.textContent));
            }
            userInput.focus();
        </script>
    </body>
</html>
